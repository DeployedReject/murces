name: Continuous Release on Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.notes.outputs.tag_name }}
      pom_version: ${{ steps.notes.outputs.pom_version }}

    steps:
      # Pinned to actions/checkout v4.2.2
      - name: Check out repository (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify Required Secrets
        run: |
          if [ -z "${{ secrets.CURSE_API }}" ] || [ -z "${{ secrets.EMAIL }}" ]; then
            echo "::error::Missing required repository secrets: CURSE_API and/or EMAIL must be defined."
            exit 1
          fi

      - name: Extract Version and Generate Release Notes
        id: notes
        run: |
          # 1. Extract version from java/tui/pom.xml
          POM_VERSION=$(grep -m 1 '<version>' java/tui/pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')

          if [ -z "$POM_VERSION" ]; then
            POM_VERSION="1.0"
          fi

          # 2. Construct tag: v<version>-<YYYYMMDD>.<HHMMSS> (UTC)
          TIMESTAMP=$(date -u +'%Y%m%d.%H%M%S')
          TAG_NAME="v${POM_VERSION}-${TIMESTAMP}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "pom_version=$POM_VERSION" >> "$GITHUB_OUTPUT"

          # 3. Collect commits for changelog
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          echo "### Release $TAG_NAME" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "Commits since **$PREV_TAG**:" >> release_notes.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h by %an)" >> release_notes.md
          else
            echo "Commits included in this release:" >> release_notes.md
            git log -n 20 --pretty=format:"* %s (%h by %an)" >> release_notes.md
          fi
          echo "" >> release_notes.md

      - name: Upload Release Notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            asset_name: murces-linux-amd64
            target_binary: murces
          - os: ubuntu-24.04-arm
            arch: arm64
            asset_name: murces-linux-arm64
            target_binary: murces
          - os: windows-latest
            arch: amd64
            asset_name: murces-windows-amd64.exe
            target_binary: murces.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Set up MSVC Developer Tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Pinned to your specified graalvm/setup-graalvm commit SHA
      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Build Orchestrator
        env:
          email: ${{ secrets.EMAIL }}
          curseAPI: ${{ secrets.CURSE_API }}
        run: |
          cd java/orchestrator
          mvn clean install -DskipTests

      - name: Build Native Binary (GraalVM Native Image)
        env:
          email: ${{ secrets.EMAIL }}
          curseAPI: ${{ secrets.CURSE_API }}
        run: |
          cd java/tui
          mvn clean package -Pnative -DskipTests

      - name: Verify Binary with Headless Self-Test (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x java/tui/target/${{ matrix.target_binary }}
          ./java/tui/target/${{ matrix.target_binary }} --test-tui

      - name: Verify Binary with Headless Self-Test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./java/tui/target/${{ matrix.target_binary }} --test-tui

      - name: Prepare Standalone Executable and Portable Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp java/tui/target/${{ matrix.target_binary }} ./${{ matrix.asset_name }}
          chmod +x ./${{ matrix.asset_name }}
          # Create portable tar.gz bundle containing executable, install script, and README
          mkdir -p portable-dist
          cp ./${{ matrix.asset_name }} portable-dist/${{ matrix.target_binary }}
          cp README.md LICENSE portable-dist/
          tar -czf ./${{ matrix.asset_name }}-portable.tar.gz -C portable-dist .
          rm -rf portable-dist

      - name: Prepare Standalone Executable and Portable Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp java/tui/target/${{ matrix.target_binary }} ./${{ matrix.asset_name }}
          # Create portable zip bundle
          mkdir -p portable-dist
          cp ./${{ matrix.asset_name }} portable-dist/${{ matrix.target_binary }}
          cp README.md LICENSE portable-dist/
          powershell -Command "Compress-Archive -Path 'portable-dist\*' -DestinationPath './${{ matrix.asset_name }}-portable.zip' -Force"
          rm -rf portable-dist

      - name: Upload Native Binary Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: ./${{ matrix.asset_name }}*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Download Release Notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
          path: .

      - name: Download Linux amd64 Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: murces-linux-amd64
          path: .

      - name: Download Linux arm64 Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: murces-linux-arm64
          path: .

      - name: Download Windows amd64 Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: murces-windows-amd64.exe
          path: .

      - name: Prepare Release Assets
        run: |
          chmod +x murces-linux-amd64 murces-linux-arm64
          ls -la murces-*

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag_name }}" \
            murces-* \
            --title "MurCes ${{ needs.prepare.outputs.tag_name }}" \
            --notes-file release_notes.md
