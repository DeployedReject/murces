name: Continuous Release on Push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Pinned to actions/checkout v4.2.2
      - name: Check out repository (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Extract Version and Generate Release Notes
        id: notes
        run: |
          # 1. Extract version from java/tui/pom.xml
          POM_VERSION=$(grep -m 1 '<version>' java/tui/pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')

          if [ -z "$POM_VERSION" ]; then
            POM_VERSION="1.0"
          fi

          # 2. Construct tag: v<version>-<YYYYMMDD>.<HHMMSS> (UTC)
          TIMESTAMP=$(date -u +'%Y%m%d.%H%M%S')
          TAG_NAME="v${POM_VERSION}-${TIMESTAMP}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "pom_version=$POM_VERSION" >> "$GITHUB_OUTPUT"

          # 3. Collect commits for changelog
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          echo "### Release $TAG_NAME" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "Commits since **$PREV_TAG**:" >> release_notes.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h by %an)" >> release_notes.md
          else
            echo "Commits included in this release:" >> release_notes.md
            git log -n 20 --pretty=format:"* %s (%h by %an)" >> release_notes.md
          fi
          echo "" >> release_notes.md

      # Pinned to graalvm/setup-graalvm v1.3.7
      - name: Set up GraalVM JDK
        uses: graalvm/setup-graalvm@c25257ef51db8f6dcf776510ea4b4f3b5bc1a5f6
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Build Orchestrator
        env:
          email: "release@murces.local"
          curseAPI: "placeholder"
        run: |
          cd java/orchestrator
          mvn clean install -DskipTests

      - name: Build Native Binary (GraalVM Native Image)
        env:
          email: "release@murces.local"
          curseAPI: "placeholder"
        run: |
          cd java/tui
          mvn clean package -Pnative -DskipTests

      - name: Verify Binary with Headless Self-Test
        run: |
          chmod +x java/tui/target/murces
          ./java/tui/target/murces --test-tui

      - name: Package Release ZIP
        run: |
          mkdir -p dist
          # Copy compiled native executable
          cp java/tui/target/murces dist/

          # Copy any root shell scripts (svctrl.sh, backup.sh, etc.)
          cp *.sh dist/ 2>/dev/null || true

          # Set executable permissions
          chmod +x dist/murces dist/*.sh 2>/dev/null || true

          # Create zip archive
          cd dist
          zip -r ../murces.zip .
          cd ..

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.notes.outputs.tag_name }}" murces.zip \
            --title "MurCes ${{ steps.notes.outputs.tag_name }}" \
            --notes-file release_notes.md
